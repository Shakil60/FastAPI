<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Recipe App</h1>
    <div id="session" hidden>
      <span id="whoami"></span>
      <button id="logout" class="ghost">Se déconnecter</button>
    </div>
  </header>

  <p id="message" class="message" hidden></p>

  <!-- Connexion / inscription -->
  <main id="auth-view" class="card narrow" hidden>
    <div class="tabs">
      <button class="tab active" data-tab="login">Connexion</button>
      <button class="tab" data-tab="register">Inscription</button>
    </div>

    <form id="login-form">
      <label>Nom d'utilisateur <input name="username" required autocomplete="username"></label>
      <label>Mot de passe <input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Se connecter</button>
      <p class="hint">Compte de démo : <code>demo</code> / <code>demo1234</code></p>
    </form>

    <form id="register-form" hidden>
      <label>Nom d'utilisateur <input name="username" required minlength="3" maxlength="30" autocomplete="username"></label>
      <label>Email <input name="email" type="email" required autocomplete="email"></label>
      <label>Mot de passe <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <button type="submit">Créer le compte</button>
    </form>
  </main>

  <!-- Application -->
  <main id="app-view" hidden>
    <section class="card">
      <h2>Recettes</h2>
      <form id="search-form" class="row">
        <input name="query" placeholder="Rechercher un titre">
        <input name="duration" type="number" min="1" placeholder="Durée max (min)">
        <input name="servings" type="number" min="1" placeholder="Personnes min">
        <button type="submit">Filtrer</button>
        <button type="reset" class="ghost">Réinitialiser</button>
      </form>
      <ul id="recipes" class="list"></ul>
    </section>

    <section class="card">
      <h2 id="recipe-form-title">Nouvelle recette</h2>
      <form id="recipe-form" class="row">
        <input type="hidden" name="recipe_id">
        <input name="title" required minlength="3" maxlength="100" placeholder="Titre">
        <input name="duration" type="number" min="1" required placeholder="Durée (min)">
        <input name="servings" type="number" min="1" required placeholder="Personnes">
        <button type="submit">Enregistrer</button>
        <button type="button" id="cancel-edit" class="ghost" hidden>Annuler</button>
      </form>
    </section>

    <section class="card">
      <h2>Partager mes recettes</h2>
      <form id="share-form" class="row">
        <input name="username" required placeholder="Nom d'utilisateur">
        <label class="inline"><input name="can_edit" type="checkbox"> peut modifier</label>
        <button type="submit">Partager</button>
      </form>
      <h3>Accès accordés</h3>
      <ul id="granted" class="list"></ul>
      <h3>Accès reçus</h3>
      <ul id="received" class="list"></ul>
    </section>
  </main>

  <footer>API : <a id="api-link" target="_blank" rel="noopener"></a></footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
